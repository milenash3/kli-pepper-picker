<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שלדת כלי הקטיף – לוח תכנון</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1113; --panel:#161a1e; --panel2:#1c2126; --line:#2a3138; --line2:#353d46;
  --text:#e9ebee; --muted:#8e979f; --dim:#5f6870;
  --chili:#ff5a4e; --jal:#7bd389; --amber:#f6b73c; --sky:#4fb3ff; --violet:#9b8cff;
  --ok:#57c97a; --bad:#ff5a4e; --acc:#f6b73c;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Rubik,system-ui,sans-serif;font-size:13px}
button,input,select,textarea{font-family:inherit;font-size:12.5px;color:var(--text)}
.num,.mono{font-family:"JetBrains Mono",ui-monospace,monospace;direction:ltr;unicode-bidi:isolate}
#app{display:grid;grid-template-rows:52px 1fr 42px;height:100vh}
header{display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#14181b,#111417)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;white-space:nowrap}
.brand .dot{width:22px;height:22px;border-radius:7px;background:conic-gradient(from 200deg,var(--chili),var(--amber),var(--jal),var(--chili));box-shadow:0 0 0 2px #0e1113 inset}
.brand small{font-weight:400;color:var(--muted);font-size:12px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{background:none;border:0;padding:5px 10px;border-radius:7px;cursor:pointer;color:var(--muted)}
.seg button.on{background:#2a3138;color:var(--text)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--line2);background:#222830}
.btn.pri{background:var(--amber);color:#1a1405;border-color:var(--amber);font-weight:600}
.btn.red{color:var(--chili)}
.btn:disabled{opacity:.4;cursor:default}
.sp{flex:1}
#sync{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
#sync i{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block}
#sync.on i{background:var(--ok)} #sync.busy i{background:var(--amber)} #sync.off i{background:var(--chili)}
main{display:grid;grid-template-columns:270px 1fr 300px;min-height:0}
aside{background:var(--panel);overflow:auto;min-height:0}
#compPanel{border-left:1px solid var(--line)}
#ctrlPanel{border-right:1px solid var(--line)}
.ph{position:sticky;top:0;background:var(--panel);z-index:2;padding:10px 12px 8px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.ph h3{margin:0;font-size:13px;font-weight:600}
.ph .muted{font-size:11.5px}
.muted{color:var(--muted)}
.grp{padding:6px 8px 2px;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:4px}
.grp b{width:8px;height:8px;border-radius:2px;display:inline-block}
.crow{display:flex;align-items:center;gap:7px;padding:6px 10px;margin:1px 6px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.crow:hover{background:var(--panel2)}
.crow.sel{background:#232a31;border-color:var(--amber)}
.crow .sw{width:10px;height:10px;border-radius:3px;flex:none}
.crow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .qty{font-size:11px;color:var(--muted)}
.crow .warn{width:7px;height:7px;border-radius:50%;background:var(--chili);flex:none}
.crow .lk{font-size:11px}
.ib{width:20px;height:20px;border-radius:50%;border:1px solid var(--line2);background:none;color:var(--muted);cursor:pointer;font-size:11px;line-height:18px;padding:0;flex:none;font-style:italic;font-family:Georgia,serif}
.ib:hover{color:var(--text);border-color:var(--muted)}
#center{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
#kpis{display:flex;gap:8px;padding:10px 12px 8px;overflow-x:auto;border-bottom:1px solid var(--line)}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;min-width:92px;flex:1 1 0;overflow:hidden}
.kpi .l{overflow:hidden;text-overflow:ellipsis}
.kpi .l{font-size:11px;color:var(--muted);white-space:nowrap}
.kpi .v{font-size:15px;font-weight:600;margin-top:2px;white-space:nowrap}
.kpi .v small{font-size:11px;color:var(--muted);font-weight:400;margin-inline-start:3px}
.kpi.bad .v{color:var(--chili)} .kpi.good .v{color:var(--jal)}
#stage{flex:1;position:relative;min-height:0;background:radial-gradient(ellipse at 50% 35%,#1a1f24,#101316 75%)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#stageTools{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:6px;direction:ltr}
#stageTools button{width:32px;height:32px;border-radius:8px;background:rgba(22,26,30,.9);border:1px solid var(--line);cursor:pointer;font-size:15px}
#tip{position:absolute;pointer-events:none;background:rgba(14,17,19,.92);border:1px solid var(--line2);border-radius:7px;padding:3px 8px;font-size:11.5px;white-space:nowrap;display:none;z-index:4;transform:translate(-50%,calc(-100% - 12px))}
#tip .m{color:var(--muted);font-size:10.5px}
#hint{position:absolute;bottom:8px;left:10px;font-size:11px;color:var(--dim);pointer-events:none;direction:rtl}
#preview{position:absolute;top:10px;right:50%;transform:translateX(50%);max-width:92%;background:#2b2410;border:1px solid var(--amber);border-radius:10px;padding:8px 12px;display:none;gap:10px;align-items:center;z-index:5}
#preview.on{display:flex}
#checks{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--line);overflow-x:auto;background:var(--panel)}
.chk{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;white-space:nowrap;font-size:12px}
.chk i{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.chk.bad i{background:var(--bad)} .chk.acc i{background:var(--amber)}
.chk.bad{border-color:#5a2a27} .chk.acc{border-color:#5a4a20}
.chk .c{font-size:11px;color:var(--muted)}
#selPanel{border-top:1px solid var(--line);background:var(--panel);padding:8px 12px;display:none}
#selPanel.on{display:block}
#selPanel .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#selPanel .title{font-weight:600;margin-inline-end:6px}
#selPanel .acts{display:flex;gap:5px;flex-wrap:wrap}
#selPanel .acts .btn{padding:4px 8px;font-size:12px}
#selPanel .btn.on{border-color:var(--amber);color:var(--amber)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px 10px;margin-top:8px}
.fld label{display:block;font-size:10.5px;color:var(--muted);margin-bottom:2px}
.fld input,.fld select{width:100%;background:#0f1215;border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.fld input[type=number]{font-family:"JetBrains Mono",monospace;direction:ltr;text-align:left}
.est{color:var(--amber);font-size:10px;margin-inline-start:3px}
.sec{border-bottom:1px solid var(--line);padding:10px 12px}
.sec h4{margin:0 0 8px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.sec h4 .muted{font-weight:400;font-size:11px}
.sl{display:grid;grid-template-columns:1fr 58px;gap:2px 8px;align-items:center;margin-bottom:7px}
.sl label{font-size:11.5px;color:var(--muted);grid-column:1/3;display:flex;justify-content:space-between}
.sl input[type=range]{width:100%;accent-color:var(--amber)}
.sl input[type=number]{width:58px;background:#0f1215;border:1px solid var(--line);border-radius:6px;padding:3px 5px;font-family:"JetBrains Mono",monospace;direction:ltr;text-align:left}
.ro{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:12px;margin-top:6px}
.ro span:nth-child(odd){color:var(--muted)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row .btn{flex:1}
.tg{display:flex;align-items:center;gap:7px;font-size:12px;margin:4px 0;cursor:pointer}
.tg input{accent-color:var(--amber)}
select.s{background:#0f1215;border:1px solid var(--line);border-radius:6px;padding:4px 6px}
footer{display:flex;align-items:center;gap:6px;padding:0 10px;border-top:1px solid var(--line);background:#111417;overflow-x:auto}
.tab{position:relative;display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;white-space:nowrap}
.tab.on{border-color:var(--amber);background:#241f12}
.tab .ta{display:none;gap:2px}
.tab:hover .ta{display:flex}
.tab .ta button{background:none;border:0;color:var(--muted);cursor:pointer;padding:0 3px;font-size:12px}
.tab .ta button:hover{color:var(--text)}
.tab .w{font-size:10.5px;color:var(--chili)}
#modal{position:fixed;inset:0;background:rgba(5,7,9,.6);display:none;align-items:center;justify-content:center;z-index:20}
#modal.on{display:flex}
#mbox{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:min(760px,94vw);max-height:86vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#mbox .mh{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
#mbox .mh h3{margin:0;font-size:14px;flex:1}
#mbox .mb{padding:14px 16px}
#mbox table{border-collapse:collapse;width:100%;font-size:12px}
#mbox td,#mbox th{border-bottom:1px solid var(--line);padding:6px 6px;text-align:right;vertical-align:top}
#mbox th{color:var(--muted);font-weight:500}
#mbox input[type=number]{width:72px;background:#0f1215;border:1px solid var(--line);border-radius:6px;padding:3px 5px;font-family:"JetBrains Mono",monospace;direction:ltr}
#mbox textarea{width:100%;min-height:70px;background:#0f1215;border:1px solid var(--line);border-radius:8px;padding:8px}
.issue{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px;background:var(--panel2)}
.issue .row{margin-top:6px}
.why{background:#12161a;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:12px;line-height:1.55}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;border:1px solid var(--line2);color:var(--muted)}
.okc{color:var(--jal)} .badc{color:var(--chili)} .accc{color:var(--amber)}
a{color:var(--sky)}
#toast{position:fixed;bottom:56px;left:50%;transform:translateX(-50%);background:#20262c;border:1px solid var(--line2);padding:8px 14px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
#toast.on{opacity:1}
body.present .edit{display:none!important}
body.present #compPanel .crow{cursor:default}
.kbd{font-family:"JetBrains Mono",monospace;font-size:10.5px;border:1px solid var(--line2);border-radius:4px;padding:0 4px}
@media (max-width:1100px){main{grid-template-columns:230px 1fr 260px}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand"><span class="dot"></span>שלדת כלי הקטיף <small>לוח תכנון רכיבים</small></div>
  <div class="seg" id="views">
    <button data-v="3d" class="on">תלת־ממד</button><button data-v="side">צד</button><button data-v="top">מלמעלה</button><button data-v="front">חזית</button><button data-v="all">הכל</button>
  </div>
  <div class="seg" id="modes"><button data-m="design" class="on">עיצוב</button><button data-m="present">הצגה</button></div>
  <span class="sp"></span>
  <div id="sync" class="busy"><i></i><span>מתחבר…</span></div>
  <button class="btn edit" id="bUndo" title="Ctrl+Z">↶ בטל</button>
  <button class="btn edit" id="bRedo" title="Ctrl+Y">↷ חזור</button>
  <button class="btn" id="bRules">חוקי הנדסה</button>
  <button class="btn" id="bCompare">השוואה</button>
  <button class="btn" id="bGh" style="display:none">חיבור לעריכה</button>
  <button class="btn" id="bSave">שמור לקובץ</button>
  <button class="btn edit" id="bLoad">טען מקובץ</button>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
</header>
<main>
  <aside id="compPanel">
    <div class="ph"><h3>רכיבים</h3><span class="muted" id="compCount"></span></div>
    <div id="compList"></div>
  </aside>
  <section id="center">
    <div id="kpis"></div>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="stageTools"><button id="zIn" title="התקרב">+</button><button id="zOut" title="התרחק">−</button><button id="zFit" title="התאם למסך">⤢</button></div>
      <div id="preview"><span id="pvText"></span><button class="btn pri" id="pvOk">אשר</button><button class="btn" id="pvNo">בטל</button></div>
      <div id="tip"></div>
      <div id="hint">גרירה של רכיב: הזזה · Shift+גרירה: למעלה/למטה · גרירה של הרקע: סיבוב · גלגלת: זום · כפתור ימני: הזזת מבט</div>
    </div>
    <div id="checks"></div>
    <div id="selPanel"></div>
  </section>
  <aside id="ctrlPanel"></aside>
</main>
<footer id="tabs"></footer>
</div>
<div id="modal"><div id="mbox"></div></div>
<div id="toast"></div>

<script>
"use strict";
/* ================== utilities ================== */
const $=s=>document.querySelector(s);
const D=Math.PI/180;
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>Math.random().toString(36).slice(2,10);
const r1=v=>Math.round(v*10)/10, r2=v=>Math.round(v*100)/100;
const fmt=(v,d=1)=>(v==null||!isFinite(v))?'—':(+v).toFixed(d);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const mul=(a,k)=>[a[0]*k,a[1]*k,a[2]*k], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const len=a=>Math.hypot(a[0],a[1],a[2]), norm=a=>{const l=len(a)||1;return [a[0]/l,a[1]/l,a[2]/l]};

const CAT={
  chassis:{n:'שלדה',c:'#8d97a8'}, wheel:{n:'גלגלים',c:'#2d3037'}, power:{n:'חשמל',c:'#f6b73c'},
  drive:{n:'הנעה',c:'#ff8a4c'}, compute:{n:'בקרה ומחשוב',c:'#2ec4b6'}, sensor:{n:'חיישנים',c:'#9b8cff'},
  arm:{n:'זרוע וכלי קצה',c:'#e9e6e1'}, bin:{n:'ארגז',c:'#7bd389'}, safety:{n:'בטיחות',c:'#ff5a4e'}, charge:{n:'טעינה',c:'#4fb3ff'}
};
const CAT_ORDER=['arm','bin','power','compute','drive','sensor','charge','safety','wheel'];

/* ================== default configuration (from the component list, 16.11.2026) ================== */
function makeDefault(){
  const ch={type:'ladder',L:90,FW:19,profW:4,profH:4,wall:0.2,mat:'steel',cross:3,plateT:0.5,clear:10,WB:66,axOff:0,wheelD:25.4,tireW:8,gap:2.5,susp:'rocker',pivX:0,maxArt:5.5,beamW:2};
  const C=(o)=>Object.assign({id:uid(),locked:false,qty:1,wEst:false,pEst:false,fov:null,link:'',ip:'',note:'',rot:0},o);
  const comps=[
    C({key:'arm',name:'זרוע Kinova Gen3 lite',model:'Kinova Gen3 lite',cat:'arm',shape:'arm',L:11.5,W:11.5,H:24.3,x:-25.75,y:-3.5,z:14,mount:'top',weight:5.4,power:30,pEst:true,ip:'IP22',
      link:'https://docs.clearpathrobotics.com/assets/files/clearpath_robotics_022586-TDS2-e371286ff4ca19bcebd345a43380ef0f.pdf',
      note:'6 צירים, טווח 76, מטען 0.5 ק״ג. בסיס 24.3 (12.8 עד המפרק הראשון); זרוע עליונה 28; אמה 14; שורש כף יד 10.5+10.5; עד מרכז האוחז 13. בקר בתוך הבסיס. 21–30 וולט, עד 40°C. בסיס: 4 ברגי M6 על 4×4. צריכה ממוצעת: הנחה.'}),
    C({key:'armcover',name:'מעטפת מגן לזרוע',model:'בנייה עצמית',cat:'arm',shape:'none',L:0,W:0,H:0,x:0,y:0,z:0,mount:'arm',weight:0.75,wEst:true,power:0,note:'משקל לא ידוע (הנחה 0.5–1.0 ק״ג). מחולק לאורך הזרוע בחישוב מרכז הכובד.'}),
    C({key:'ee',name:'כלי קצה Fin-Ray + מספריים',model:'בנייה עצמית',cat:'arm',shape:'none',L:1.3,W:4.2,H:0.8,x:0,y:0,z:0,mount:'armtip',weight:0.25,wEst:true,power:0,note:'כל אצבע 1.3×4.2×0.8 (הנחה); פתיחה 3.8. על האוחז המקורי של Kinova (0.2 ק״ג).'}),
    C({key:'d405',name:'מצלמת RealSense D405',model:'Intel RealSense D405',cat:'sensor',shape:'none',L:2.3,W:4.2,H:4.2,x:0,y:0,z:0,mount:'armtip',weight:0.06,power:1.5,pEst:true,link:'https://realsenseai.com/products/stereo-depth-camera-d405/',note:'על קצה הזרוע. עד 35°C.'}),
    C({key:'ring',name:'תאורת טבעת Balluff',model:'Balluff BAE011T (BAE LX-VS-RW040)',cat:'sensor',shape:'none',L:1.3,W:4.05,H:4.05,x:0,y:0,z:0,mount:'armtip',weight:0.05,wEst:true,power:2.5,ip:'IP20',link:'https://www.balluff.com/en-us/products/BAE011T',note:'לבנה, 24 וולט, עד 104 mA (Boost עד 170). Trigger מובנה. IP20 – צריך חלון אטום. משקל לא פורסם (הנחה).'}),
    C({key:'bin',name:'קופסת פלפלים 30 ליטר',model:'30 ליטר',cat:'bin',shape:'bin',L:40,W:39,H:24,x:25,y:0,z:40.7,mount:'free',weight:3,wEst:true,power:0,note:'חוץ כ־40×39×24; פנים 37×36×22.5. עד 10 ק״ג פלפלים. משקל ריק: הנחה.'}),

function massItems(s,ov={}){

  chassisParts(s).forEach(p=>{const b=p.b;items.push({m:partMass(s,p),p:[(b.x0+b.x1)/2,(b.y0+b.y1)/2,(b.z0+b.z1)/2],g:'chassis'})});
  const wc=byKey(s,'wheel'); wheelBoxes(s).forEach(w=>items.push({m:wc?wc.weight:4,p:[w.x,w.y,s.ch.wheelD/2],g:'wheel'}));
  const P=fk(s,pose), mid=(a,b)=>mul(add(a,b),.5);

  const A=armBase(s);
  if(A){ items.push({m:armW*0.4,p:[A.x,A.y,A.z+12],g:'arm'},{m:armW*0.3,p:mid(P.S,P.p1),g:'arm'},{m:armW*0.25,p:mid(P.p1,P.p2),g:'arm'},{m:armW*0.05,p:mid(P.p2,P.p3),g:'arm'}); }
  s.comps.filter(c=>c.mount==='armtip').forEach(c=>items.push({m:c.weight,p:P.p3,g:'arm'}));
  const bin=byKey(s,'bin');
  s.comps.forEach(c=>{ if(c.mount==='arm'||c.mount==='armtip'||c.mount==='wheels'||c.shape==='arm'||c.shape==='none') return;
    let p=[c.x,c.y,c.z+c.H/2];

    else if(c.key==='bin'||c.mount==='bin') p=rotBin(s,p,tilt);

  s.comps.filter(c=>c.mount==='belly'||(c.key==='wsb'&&c.mount==='free')).forEach(c=>{const b=boxOf(c);x0=Math.min(x0,b.x0);x1=Math.max(x1,b.x1)});

}

function viewports(){
  const W=VW,H=VH;
  if(UI.view!=='all') return [{kind:UI.view,x:0,y:0,w:W,h:H}];
  const w=W/2,h=H/2; return [{kind:'3d',x:w,y:0,w,h},{kind:'side',x:0,y:0,w,h},{kind:'top',x:w,y:h,w,h},{kind:'front',x:0,y:h,w,h}];
}
function camFor(vp){
  const cx=vp.x+vp.w/2, cy=vp.y+vp.h/2;
  if(vp.kind==='3d'){ const y=ORB.yaw*D,p=ORB.pitch*D; const dir=[Math.cos(p)*Math.cos(y),Math.cos(p)*Math.sin(y),Math.sin(p)];
    const pos=add(ORB.t,mul(dir,ORB.dist)); const f=mul(dir,-1); const r=norm(cross(f,[0,0,1])); const u=cross(r,f);
    const foc=vp.h/(2*Math.tan(20*D)); return {persp:true,pos,f,r,u,foc,cx,cy,vp}; }
  const O=ORTHO[vp.kind]; let f,u;
  if(vp.kind==='side'){f=[0,1,0];u=[0,0,1]} else if(vp.kind==='top'){f=[0,0,-1];u=[0,1,0]} else {f=[-1,0,0];u=[0,0,1]}
  const r=cross(f,u); const pos=add(O.c,mul(f,-2000)); return {persp:false,pos,f,r,u,sc:O.s*(vp.h/600),cx,cy,vp,C:O.c};
}
function proj(cam,p){ const d=sub(p,cam.pos), z=dot(d,cam.f);
  if(cam.persp){ if(z<5) return null; const k=cam.foc/z; return [cam.cx+dot(d,cam.r)*k, cam.cy-dot(d,cam.u)*k, z]; }
  return [cam.cx+dot(sub(p,cam.C),cam.r)*cam.sc, cam.cy-dot(sub(p,cam.C),cam.u)*cam.sc, z]; }
function rayFor(cam,sx,sy){
  if(cam.persp){ const d=norm(add(cam.f,add(mul(cam.r,(sx-cam.cx)/cam.foc),mul(cam.u,-(sy-cam.cy)/cam.foc)))); return {o:cam.pos,d}; }
  const o=add(cam.C,add(mul(cam.r,(sx-cam.cx)/cam.sc),add(mul(cam.u,-(sy-cam.cy)/cam.sc),mul(cam.f,-2000)))); return {o,d:cam.f}; }
function rayPlane(ray,P,n){ const dn=dot(ray.d,n); if(Math.abs(dn)<1e-6) return null; const t=dot(sub(P,ray.o),n)/dn; if(t<0) return null; return add(ray.o,mul(ray.d,t)); }

let PICK=[];
function draw(){
  if(!SCENE) buildScene();
  const dpr=DPR; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,VW,VH);
  PICK=[];
  viewports().forEach(vp=>{ ctx.save(); ctx.beginPath(); ctx.rect(vp.x,vp.y,vp.w,vp.h); ctx.clip(); drawVP(vp); ctx.restore();
    if(UI.view==='all'){ ctx.strokeStyle='#2a3138'; ctx.lineWidth=1; ctx.strokeRect(vp.x+.5,vp.y+.5,vp.w-1,vp.h-1);
      ctx.fillStyle='#8e979f'; ctx.font='12px Rubik'; ctx.textAlign='right'; ctx.direction='rtl'; ctx.fillText({'3d':'תלת־ממד',side:'צד',top:'מלמעלה',front:'חזית'}[vp.kind],vp.x+vp.w-10,vp.y+18); } });
}
function drawVP(vp){
  const cam=camFor(vp), sc=SCENE;
  // ground
  const G=200, gp=[[-G,-G,0],[G,-G,0],[G,G,0],[-G,G,0]];
  if(vp.kind!=='side'&&vp.kind!=='front'){ fillPoly(cam,gp,'rgba(28,34,39,1)'); const pw=S.rules.pathW/2; fillPoly(cam,[[-G,-pw,0],[G,-pw,0],[G,pw,0],[-G,pw,0]],'rgba(48,40,30,.55)'); }
  ctx.lineWidth=1;
  for(let i=-G;i<=G;i+=10){ const strong=i%50===0; ctx.strokeStyle=strong?'rgba(70,80,90,.55)':'rgba(55,63,71,.35)';
    if(vp.kind==='side'||vp.kind==='front'){ if(i===0){ const a=proj(cam,[-G,-G,0]),b=proj(cam,[G,G,0]); if(a&&b){ctx.strokeStyle='#4a535c';ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()} } continue; }
    segLine(cam,[i,-G,0],[i,G,0],20); segLine(cam,[-G,i,0],[G,i,0],20); }
  if(vp.kind!=='side'&&vp.kind!=='front') sc.shadows.forEach(b=>fillPoly(cam,[[b.x0-1,b.y0-1,0.05],[b.x1+1,b.y0-1,0.05],[b.x1+1,b.y1+1,0.05],[b.x0-1,b.y1+1,0.05]],'rgba(0,0,0,.22)'));
  // polys
  const list=[];
  for(const pl of sc.polys){
    if(pl.cull){ const v=cam.persp?sub(pl.c,cam.pos):cam.f; if(dot(pl.n,v)>=0) continue; }
    const sp=[]; let ok=true, zs=0; for(const q of pl.p){const r=proj(cam,q); if(!r){ok=false;break} sp.push(r); zs+=r[2]} if(!ok) continue;
    const zc=proj(cam,pl.c); list.push({pl,sp,z:zc?zc[2]:zs/sp.length});
  }
  list.sort((a,b)=>b.z-a.z);
  const selId=UI.sel, warn=RES.warnIds;
  for(const it of list){ const pl=it.pl; let k=0.55+0.45*Math.max(0,dot(pl.n,LIGHT)); if(!pl.cull) k=0.75+0.25*Math.abs(dot(pl.n,LIGHT));
    const isSel=pl.id&&pl.id===selId; let rgb=pl.rgb; if(isSel) rgb=rgb.map(v=>Math.min(255,v*1.15+18));
    ctx.beginPath(); it.sp.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.closePath();
    ctx.fillStyle=shadeCol(rgb,k,pl.a); ctx.fill();
    ctx.strokeStyle=pl.flat?'rgba(90,160,95,.10)':isSel?'rgba(246,183,60,.95)':(pl.id&&warn.has(pl.id)&&UI.mode==='design'?'rgba(255,90,78,.55)':`rgba(0,0,0,${pl.a<1?0.12:0.22})`); ctx.lineWidth=isSel?1.4:0.6; ctx.stroke();
    if(pl.id) PICK.push({sp:it.sp,id:pl.id,vp});
  }
  // overlay fills & lines
  sc.fills.forEach(f=>fillPoly(cam,f.p,hexA(f.col,f.a)));
  sc.lines.forEach(l=>{const a=proj(cam,l.a),b=proj(cam,l.b); if(!a||!b) return; ctx.strokeStyle=l.col; ctx.lineWidth=l.w||1; ctx.setLineDash(l.dash||[]); ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); ctx.setLineDash([]);});
  ctx.font='11.5px Rubik'; ctx.direction='rtl'; ctx.textAlign='center';
  sc.labels.forEach(l=>{const a=proj(cam,l.p); if(!a) return; const w=ctx.measureText(l.t).width+10; ctx.fillStyle='rgba(14,17,19,.78)'; roundRect(a[0]-w/2,a[1]-9,w,17,5); ctx.fill(); ctx.fillStyle=l.col||'#e9ebee'; ctx.fillText(l.t,a[0],a[1]+3.5);});
  if(vp.kind==='3d') axisGizmo(cam,vp);
}
function hexA(h,a){const c=hexRgb(h);return `rgba(${c[0]},${c[1]},${c[2]},${a})`}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function fillPoly(cam,pts,col){const sp=pts.map(p=>proj(cam,p)); if(sp.some(q=>!q)) return; ctx.beginPath(); sp.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.closePath(); ctx.fillStyle=col; ctx.fill();}
function segLine(cam,a,b,n){ ctx.beginPath(); let pen=false; for(let i=0;i<=n;i++){const p=proj(cam,add(a,mul(sub(b,a),i/n))); if(!p){pen=false;continue} if(pen)ctx.lineTo(p[0],p[1]); else {ctx.moveTo(p[0],p[1]);pen=true}} ctx.stroke(); }
function axisGizmo(cam,vp){ const o=[vp.x+vp.w-46,vp.y+vp.h-46]; [[[1,0,0],'#ff5a4e','קדימה'],[[0,1,0],'#7bd389','שמאל'],[[0,0,1],'#4fb3ff','למעלה']].forEach(([d,c,t])=>{
  const x=dot(d,cam.r)*24, y=-dot(d,cam.u)*24; ctx.strokeStyle=c; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(o[0],o[1]); ctx.lineTo(o[0]+x,o[1]+y); ctx.stroke(); ctx.fillStyle=c; ctx.font='10px Rubik'; ctx.fillText(t,o[0]+x*1.35,o[1]+y*1.35+3); }); }
function rerender(){ buildScene(); draw(); }

function pickAt(x,y){
  for(let i=PICK.length-1;i>=0;i--){const it=PICK[i]; if(x<it.vp.x||x>it.vp.x+it.vp.w||y<it.vp.y||y>it.vp.y+it.vp.h) continue; if(pip(x,y,it.sp)) return it.id;}
  return null;
}
function pip(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){if(((p[i][1]>y)!==(p[j][1]>y))&&(x<(p[j][0]-p[i][0])*(y-p[i][1])/(p[j][1]-p[i][1])+p[i][0]))c=!c}return c}
function vpAt(x,y){return viewports().find(v=>x>=v.x&&x<=v.x+v.w&&y>=v.y&&y<=v.y+v.h)}

/* ---------- interaction ---------- */
let drag=null;
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top; const vp=vpAt(x,y); if(!vp) return;
  cv.setPointerCapture(e.pointerId);
  const id=e.button===0?pickAt(x,y):null; const c=id&&S.comps.find(k=>k.id===id);
  if(c){ UI.sel=c.id; renderSide(); }
  else if(e.button===0&&id!=='chassis'){ /* keep selection on background drag */ }
  if(id==='chassis'&&e.button===0){ UI.sel=null; renderSide(); }
  const movable=c&&UI.mode==='design'&&!c.locked&&!['wheels','armtip','arm','binact'].includes(c.mount)&&c.shape!=='none';
  if(movable){ const cam=camFor(vp); const ctr=[c.x,c.y,c.z+c.H/2];
    const vertical=e.shiftKey; let n; if(cam.persp&&!vertical) n=[0,0,1]; else if(cam.persp){const h=[cam.f[0],cam.f[1],0]; n=norm(h)} else n=mul(cam.f,-1);
    const P0=cam.persp&&!vertical?[c.x,c.y,c.z]:ctr; const hit=rayPlane(rayFor(cam,x,y),P0,n); if(!hit) return;
    drag={type:'comp',id:c.id,vp,n,P0,hit0:hit,start:[c.x,c.y,c.z],before:JSON.stringify(S),vertical,moved:false};
  } else { drag={type:(e.button===2||e.button===1||vp.kind!=='3d')?'pan':'orbit',vp,x,y,yaw:ORB.yaw,pitch:ORB.pitch,t:ORB.t.slice(),oc:vp.kind!=='3d'?ORTHO[vp.kind].c.slice():null,click:!id,clickId:id}; }
  draw();
});
cv.addEventListener('pointermove',e=>{
  const r=cv.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  if(!drag){ const id=pickAt(x,y); cv.style.cursor=id&&id!=='chassis'&&UI.mode==='design'?'grab':'default'; showTip(id,x,y); return; }
  hideTip();
  if(drag.type==='comp'){ const c=S.comps.find(k=>k.id===drag.id); const cam=camFor(drag.vp); const hit=rayPlane(rayFor(cam,x,y),drag.P0,drag.n); if(!hit) return;
    const d=sub(hit,drag.hit0); const snap=v=>Math.round(v*2)/2;
    let nx=drag.start[0]+d[0], ny=drag.start[1]+d[1], nz=drag.start[2]+d[2];
    if(cam.persp&&!drag.vertical){nz=drag.start[2]}
    if(cam.persp&&drag.vertical){nx=drag.start[0];ny=drag.start[1]}
    nx=snap(nx);ny=snap(ny);nz=snap(nz);
    const old=[c.x,c.y,c.z], oldMount=c.mount;
    const zMoved=Math.abs(nz-drag.start[2])>0.25;
    if(c.key==='rtk') c.onLidar=false;
    if(c.mount==='top'&&!zMoved){ c.x=nx;c.y=ny;c.z=chTop(S); c._lift=60; c.z=supportZ(S,c); delete c._lift; }
    else { c.x=nx;c.y=ny;c.z=Math.max(0,nz); if(c.mount==='top'&&zMoved) c.mount='free'; }
    resolve(S);
    if(UI.avoid&&collides(S,c)){ // try axis-separated
      const tries=[[nx,old[1],c.z],[old[0],ny,c.z]]; let okk=false;
      for(const t of tries){ c.x=t[0];c.y=t[1]; if(c.mount==='top'){c.z=chTop(S);c._lift=60;c.z=supportZ(S,c);delete c._lift} resolve(S); if(!collides(S,c)){okk=true;break} }
      if(!okk){ c.x=old[0];c.y=old[1];c.z=old[2];c.mount=oldMount; resolve(S); }
    }
    drag.moved=true; RES=compute(S); rerender(); renderKPIs(); renderChecks(); return; }
  const dx=x-drag.x, dy=y-drag.y; if(Math.abs(dx)+Math.abs(dy)>3) drag.click=false;
  if(drag.type==='orbit'){ ORB.yaw=drag.yaw-dx*0.4; ORB.pitch=clamp(drag.pitch+dy*0.3,-5,89); draw(); }
  else if(drag.type==='pan'){ const cam=camFor(drag.vp);
    if(drag.vp.kind==='3d'){ const k=ORB.dist/cam.foc; ORB.t=add(drag.t,add(mul(cam.r,-dx*k),mul(cam.u,dy*k))); }
    else { const O=ORTHO[drag.vp.kind]; O.c=add(drag.oc,add(mul(cam.r,-dx/cam.sc),mul(cam.u,dy/cam.sc))); }
    draw(); }
});
cv.addEventListener('pointerleave',()=>hideTip());
function hideTip(){$('#tip').style.display='none'}
function showTip(id,x,y){ const T=$('#tip'); if(!id){hideTip();return}
  let t,m='';
  if(id==='chassis'){ t=(S.ch.type==='ladder'?'מסגרת סולם':'פלטה')+' · '+MAT[S.ch.mat].n; m=`${fmt(S.ch.L)} × ${fmt(S.ch.FW)} ס״מ · ${fmt(RES.kpi.chM,2)} ק״ג`; }
  else { const c=S.comps.find(k=>k.id===id); if(!c){hideTip();return} t=c.name;
    m=c.key==='wheel'?`Ø${S.ch.wheelD} × ${S.ch.tireW} · ${c.weight} ק״ג`:c.shape==='arm'?`${c.model} · ${c.weight} ק״ג`:`${r2(c.L)} × ${r2(c.W)} × ${r2(c.H)} ס״מ · ${c.weight} ק״ג`;
    if(RES.warnIds.has(id)) m+=' · ⚠ יש אזהרה'; }
  T.innerHTML=`${esc(t)}<div class="m">${esc(m)}</div>`; T.style.left=x+'px'; T.style.top=y+'px'; T.style.display='block'; }
cv.addEventListener('pointerup',e=>{
  if(drag&&drag.type==='comp'&&drag.moved){ const after=JSON.stringify(S); if(after!==drag.before){hist.past.push(drag.before);hist.future=[]} drag=null; changed(); return; }
  if(drag&&drag.click&&!drag.clickId){ UI.sel=null; renderSide(); rerender(); }
  drag=null;
});
cv.addEventListener('wheel',e=>{ e.preventDefault(); const r=cv.getBoundingClientRect(); const vp=vpAt(e.clientX-r.left,e.clientY-r.top)||viewports()[0]; zoom(e.deltaY>0?1.12:1/1.12,vp.kind); },{passive:false});
function zoom(k,kind){ if(UI.view==='all'&&!kind){ ORB.dist=clamp(ORB.dist*k,40,1500); Object.values(ORTHO).forEach(o=>o.s=clamp(o.s/k,0.3,30)); }
  else if((kind||UI.view)==='3d') ORB.dist=clamp(ORB.dist*k,40,1500); else { const o=ORTHO[kind||UI.view]; o.s=clamp(o.s/k,0.3,30); } draw(); }
function fitView(){ const k=RES.kpi; const L=Math.max(k.Lt||100,60), H=Math.max(k.Ht||60,40);
  ORB.t=[0,0,H*0.42]; ORB.dist=Math.max(L,H)*2.4;
  const vps=viewports(); const vp=vps.find(v=>v.kind!=='3d')||{w:VW,h:VH}; const scl=Math.min(vp.w/(L*1.5),vp.h/(H*1.9))/(vp.h/600);
  ORTHO.side={s:scl,c:[0,0,H/2]}; ORTHO.front={s:Math.min(vp.w/110,vp.h/(H*1.9))/(vp.h/600),c:[0,0,H/2]}; ORTHO.top={s:Math.min(vp.w/(L*1.5),vp.h/120)/(vp.h/600),c:[0,0,0]};
  draw(); }
function resize(){ const r=cv.getBoundingClientRect(); DPR=window.devicePixelRatio||1; VW=r.width; VH=r.height; cv.width=Math.max(1,VW*DPR); cv.height=Math.max(1,VH*DPR); draw(); }
window.addEventListener('resize',resize);

/* ================== panels ================== */
function renderAll(){ buildScene(); draw(); renderSide(); renderKPIs(); renderChecks(); renderCtrl(); renderTabs(); $('#bUndo').disabled=!hist.past.length; $('#bRedo').disabled=!hist.future.length; }
function renderSide(){ renderList(); renderSel(); }
function renderList(){
  const L=$('#compList'); const groups={}; S.comps.forEach(c=>{(groups[c.cat]=groups[c.cat]||[]).push(c)});
  let h=''; let n=0;
  CAT_ORDER.forEach(cat=>{ const g=groups[cat]; if(!g) return; h+=`<div class="grp"><b style="background:${CAT[cat].c}"></b>${CAT[cat].n}</div>`;
    const seen={}; g.forEach(c=>{ const k=c.key+'|'+c.name; const cnt=g.filter(o=>o.key+'|'+o.name===k).length; if(seen[k]&&c.id!==UI.sel) return; seen[k]=1; const q=(c.qty||1)*(cnt>1&&c.id!==UI.sel?cnt:1); n+=q;
      const warn=RES.warnIds.has(c.id)||(cnt>1&&g.some(o=>o.key+'|'+o.name===k&&RES.warnIds.has(o.id)));
      h+=`<div class="crow ${UI.sel===c.id?'sel':''}" data-id="${c.id}"><span class="sw" style="background:${CAT[c.cat].c}"></span><span class="nm" title="${esc(c.model||'')}">${esc(c.name)}</span>${q>1?`<span class="qty num">${q}×</span>`:''}${c.locked?'<span class="lk" title="נעול">🔒</span>':''}${warn?'<span class="warn" title="יש אזהרה"></span>':''}<button class="ib" data-card="${c.id}" title="כרטיס רכיב">i</button></div>`; });
  });
  h+=`<div class="grp"><b style="background:${CAT.chassis.c}"></b>שלדה</div><div class="crow" data-id="__ch"><span class="sw" style="background:${CAT.chassis.c}"></span><span class="nm">${S.ch.type==='ladder'?'מסגרת סולם':'פלטה'} · ${MAT[S.ch.mat].n}</span><span class="qty num">${fmt(RES.kpi.chM,2)} kg</span></div>`;
  L.innerHTML=h; $('#compCount').textContent=n+' יחידות';
  L.querySelectorAll('.crow').forEach(r=>r.onclick=e=>{ if(e.target.dataset.card){openCard(e.target.dataset.card);return} const id=r.dataset.id; if(id==='__ch') return; UI.sel=UI.sel===id?null:id; renderSide(); rerender(); });
}
function renderKPIs(){
  const k=RES.kpi, cg=RES.cg, st=RES.stab;
  const items=[['משקל כולל',fmt(cg.m),'ק״ג'],['צריכה ממוצעת',fmt(k.P,0),'W'],['זמן עבודה',fmt(k.run),'שעות',k.run<S.rules.minRun?'bad':'good'],
    ['מידות כוללות',`${fmt(k.Lt,0)}×${fmt(k.W,0)}×${fmt(k.Ht,0)}`,'ס״מ',k.W>S.rules.maxWidth+0.05?'bad':''],['גובה מרכז כובד',fmt(cg.z),'ס״מ'],
    ['התהפכות צידית (גרוע)',fmt(st.minLat),'°',st.minLat<S.rules.minLat?'bad':'good'],['ניצולת שטח שלדה',fmt(k.fill,0),'%'],['אזהרות',k.warn,'',k.warn?'bad':'good']];
  $('#kpis').innerHTML=items.map(([l,v,u,c])=>`<div class="kpi ${c||''}"><div class="l">${l}</div><div class="v num">${v}<small>${u}</small></div></div>`).join('');
}
function renderChecks(){
  $('#checks').innerHTML=RES.checks.map(c=>`<div class="chk ${c.status}" data-c="${c.id}"><i></i>${c.n}${c.issues.length?`<span class="c num">${c.issues.length}</span>`:''}</div>`).join('');
  $('#checks').querySelectorAll('.chk').forEach(e=>e.onclick=()=>openCheck(e.dataset.c));
}
function fld(lbl,key,val,step=0.1,extra=''){return `<div class="fld"><label>${lbl}${extra}</label><input type="number" step="${step}" data-f="${key}" value="${val}"></div>`}
function renderSel(){
  const P=$('#selPanel'); const c=S.comps.find(k=>k.id===UI.sel); if(!c){P.classList.remove('on');P.innerHTML='';return}
  P.classList.add('on'); const rec=recSpot(S,c); const fixed=['wheels','armtip','arm'].includes(c.mount)||c.shape==='none';
  let h=`<div class="top"><span class="sw" style="width:10px;height:10px;border-radius:3px;background:${CAT[c.cat].c};display:inline-block"></span><span class="title">${esc(c.name)}</span><span class="muted">${esc(c.model||'')}</span><span class="sp"></span>
  <div class="acts edit">
   ${fixed?'':`<button class="btn ${c.locked?'on':''}" data-a="lock">${c.locked?'🔒 נעול':'נעל מיקום'}</button>
   <button class="btn" data-a="rotH" title="מחליף אורך ורוחב">סובב אופקית 90°</button><button class="btn" data-a="rotV" title="מחליף אורך וגובה">סובב אנכית 90°</button>
   <button class="btn" data-a="dup">שכפל</button>`}
   ${c.key==='wheel'||c.key==='bin'||c.key==='arm'||c.key==='battery'?'':`<button class="btn red" data-a="del">מחק</button>`}

  h+=`<button class="btn edit" id="tabAdd" title="קונפיגורציה חדשה">+ חדשה</button>`;
  const T=$('#tabs'); T.innerHTML=h;
  T.querySelectorAll('.tab[data-id]').forEach(t=>t.onclick=e=>{ const id=t.dataset.id, a=e.target.dataset.t;
    if(a==='dup'){ const c=CFG.list[id]; const n={id:uid(),name:c.name+' (עותק)',order:Date.now(),json:c.json,updatedAt:Date.now()}; Store.put(n); loadCfg(n.id); return; }
    if(a==='ren'){ askText('שם הקונפיגורציה',CFG.list[id].name,v=>{const c={...CFG.list[id],name:v,updatedAt:Date.now()};Store.put(c);renderTabs()}); return; }
    if(a==='del'){ confirmBox(`למחוק את "${CFG.list[id].name}"? אי אפשר לשחזר.`,()=>{ Store.del(id); if(id===CFG.active){const rest=Object.keys(CFG.list);if(rest.length)loadCfg(rest[0]);else{CFG.active=uid();CFG.draft=true;renderTabs()}} else renderTabs(); }); return; }
    if(id!==CFG.active){ saveNowIfDirty(); loadCfg(id); } });
  const ad=$('#tabAdd'); if(ad) ad.onclick=()=>{ askText('שם לקונפיגורציה החדשה','קונפיגורציה '+(ids.length+1),v=>{ const base=makeDefault(); resolve(base); const n={id:uid(),name:v,order:Date.now(),json:JSON.stringify(base),updatedAt:Date.now()}; Store.put(n); loadCfg(n.id); },'מתחילה מהסידור של התמונות. לשכפול של הנוכחית השתמשי ב־⧉ על הלשונית.'); };
}
function saveNowIfDirty(){ if(saveT){clearTimeout(saveT);saveT=null;saveNow()} }

/* ================== dialogs ================== */
function modal(title,body,wide){ const M=$('#modal'),B=$('#mbox'); B.style.width=wide?'min(1000px,96vw)':''; B.innerHTML=`<div class="mh"><h3>${title}</h3><button class="btn" id="mClose">סגור</button></div><div class="mb">${body}</div>`; M.classList.add('on'); $('#mClose').onclick=closeModal; return B; }
function closeModal(){ $('#modal').classList.remove('on') }
$('#modal').addEventListener('pointerdown',e=>{ if(e.target.id==='modal') closeModal() });
function askText(title,val,cb,note){ const B=modal(title,`${note?`<p class="muted" style="margin-top:0">${note}</p>`:''}<input id="askIn" style="width:100%;background:#0f1215;border:1px solid var(--line);border-radius:8px;padding:8px" value="${esc(val)}"><div class="row" style="margin-top:12px;justify-content:flex-start"><button class="btn pri" id="askOk" style="flex:0">אישור</button></div>`);
  const i=$('#askIn'); i.focus(); i.select(); const ok=()=>{const v=i.value.trim(); if(v){closeModal();cb(v)}}; $('#askOk').onclick=ok; i.onkeydown=e=>{if(e.key==='Enter')ok()}; }
function confirmBox(t,cb){ modal('אישור',`<p>${t}</p><div class="row" style="justify-content:flex-start"><button class="btn red" id="cfOk" style="flex:0">כן</button><button class="btn" id="cfNo" style="flex:0">לא</button></div>`); $('#cfOk').onclick=()=>{closeModal();cb()}; $('#cfNo').onclick=closeModal; }
function openCard(id){
  const c=S.comps.find(k=>k.id===id); if(!c) return; const rec=recSpot(S,c);
  let dims=c.key==='wheel'?`Ø${S.ch.wheelD} × ${S.ch.tireW}`:(c.shape==='none'?`${c.L} × ${c.W} × ${c.H}`:`${r2(c.L)} × ${r2(c.W)} × ${r2(c.H)}`);
  const iss=RES.checks.flatMap(ch=>ch.issues.filter(i=>i.ids.includes(id)).map(i=>`<li><span class="${ch.status==='acc'?'accc':'badc'}">${ch.n}:</span> ${esc(i.t)}</li>`)).join('');
  modal(esc(c.name),`<table>
   <tr><th>דגם</th><td>${esc(c.model||'—')}</td></tr>
   <tr><th>קטגוריה</th><td>${CAT[c.cat].n}</td></tr>
   <tr><th>מידות (ס״מ, X×Y×Z)</th><td class="num">${dims}</td></tr>
   <tr><th>כמות</th><td class="num">${c.qty||1}${S.comps.filter(o=>o.key===c.key&&o.name===c.name).length>1?' × '+S.comps.filter(o=>o.key===c.key&&o.name===c.name).length:''}</td></tr>
   <tr><th>משקל</th><td><span class="num">${c.weight} ק״ג</span>${c.wEst?' <span class="est">הנחה</span>':''}</td></tr>
   <tr><th>צריכה ממוצעת</th><td><span class="num">${c.power} W</span>${c.pEst?' <span class="est">הנחה</span>':''}</td></tr>
   ${c.ip?`<tr><th>אטימות</th><td>${c.ip}</td></tr>`:''}
   ${c.shape!=='none'&&c.mount!=='wheels'?`<tr><th>מיקום (מרכז X,Y · תחתית Z)</th><td class="num">${fmt(c.x)}, ${fmt(c.y)}, ${fmt(c.z)}</td></tr>`:''}
   <tr><th>הערות</th><td>${esc(c.note||'—')}</td></tr>
   ${rec?`<tr><th>המקום המומלץ</th><td>${esc(rec.why)}</td></tr>`:''}
   ${c.link?`<tr><th>מקור</th><td><a href="${esc(c.link)}" target="_blank" rel="noopener">דף נתונים</a></td></tr>`:''}
  </table>${iss?`<h4 style="margin:14px 0 6px">אזהרות על הרכיב</h4><ul style="margin:0;padding-inline-start:18px">${iss}</ul>${movable(c)&&UI.mode==='design'?`<div class="row" style="margin-top:10px;justify-content:flex-start"><button class="btn pri" id="cardFix" style="flex:0">⚠ תקן מיקום</button></div>`:''}`:''}`);
  const cf=$('#cardFix'); if(cf) cf.onclick=()=>{closeModal();runFix({smart:id,l:'מקם מחדש את '+c.name,f:st=>smartPlace(st,id)})};
}
function openCheck(cid){
  const ch=RES.checks.find(c=>c.id===cid); if(!ch) return; const acc=S.accepted[cid];
  let h=`<div><span class="pill ${ch.status==='ok'?'okc':ch.status==='acc'?'accc':'badc'}">${ch.status==='ok'?'תקין':ch.status==='acc'?'התקבל כמו שזה':'בעיה'}</span> <span class="muted">${ch.issues.length} ממצאים</span></div>
  <div class="why"><b>למה זה חשוב:</b> ${ch.why}<br><span class="muted">מקור: ${ch.src}</span></div>`;
  if(ch.detail&&ch.detail.length) h+=`<div style="margin-bottom:10px">${ch.detail.map(d=>`<div class="muted" style="font-size:12px;margin:2px 0">• ${esc(d)}</div>`).join('')}</div>`;
  ch.issues.forEach((i,n)=>{ h+=`<div class="issue"><div>${esc(i.t)}</div><div class="row edit">${i.ids.filter(id=>S.comps.some(c=>c.id===id)).map(id=>`<button class="btn" style="flex:0" data-sel="${id}">הצג ${esc(S.comps.find(c=>c.id===id).name)}</button>`).join('')}${(i.fixes||[]).map((f,k)=>`<button class="btn ${k===0?'pri':''}" style="flex:0" data-fix="${n}:${k}" title="${f.smart?'הלוח בודק מקומות אפשריים לרכיב ובוחר את המקום עם הכי מעט בעיות, קרוב למקום המומלץ הנדסית':''}">תקן: ${esc(f.l)}</button>`).join('')}</div></div>`; });
  if(ch.issues.length) h+=`<div class="edit" style="margin-top:12px"><h4 style="margin:0 0 6px">קבלה כמו שזה</h4><textarea id="accNote" placeholder="הסבר קצר: למה זה בסדר (למשל: מסכה בתוכנה לזרוע)">${esc(acc||'')}</textarea>
    <div class="row" style="margin-top:8px;justify-content:flex-start">${acc!=null?`<button class="btn" id="accDel" style="flex:0">בטל קבלה</button>`:''}<button class="btn" id="accOk" style="flex:0">${acc!=null?'עדכן הערה':'קבל כמו שזה'}</button></div></div>`;
  else if(acc!=null) h+=`<p class="muted">הערה שנשמרה: ${esc(acc)}</p>`;
  const B=modal(ch.n,h);
  B.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>{UI.sel=b.dataset.sel;closeModal();renderSide();rerender()});
  B.querySelectorAll('[data-fix]').forEach(b=>b.onclick=()=>{ const [n,k]=b.dataset.fix.split(':').map(Number); const f=ch.issues[n].fixes[k]; closeModal(); runFix(f); });
  const ok=$('#accOk'); if(ok) ok.onclick=()=>{ const v=$('#accNote').value.trim()||'התקבל'; closeModal(); commit(s=>{s.accepted[cid]=v}); };
  const dl=$('#accDel'); if(dl) dl.onclick=()=>{ closeModal(); commit(s=>{delete s.accepted[cid]}); };
}
let PV=null;
function preview(mut,text){
  if(UI.mode==='present') return; if(PV) PV.cancel();
  const before=JSON.stringify(S); const w0=RES.kpi.warn; const s2=JSON.parse(before); const res=mut(s2); resolve(s2);
  if(res&&res.moved===false){ toast(res.text); return; }
  S=s2; RES=compute(S); renderAll();
  $('#pvText').textContent=`${res&&res.text?res.text:text} · אזהרות: ${w0} ← ${RES.kpi.warn}`; $('#preview').classList.add('on');
  PV={cancel(){ S=JSON.parse(before); RES=compute(S); $('#preview').classList.remove('on'); PV=null; renderAll(); },
      ok(){ $('#preview').classList.remove('on'); PV=null; hist.past.push(before); hist.future=[]; changed(); }};
}
function runFix(f){ if(f.smart){ UI.sel=f.smart; toast('מחפש מקום הנדסי…'); setTimeout(()=>preview(st=>f.f(st),'תיקון: '+f.l),30); } else preview(st=>f.f(st),'תיקון: '+f.l); }
$('#pvOk').onclick=()=>PV&&PV.ok(); $('#pvNo').onclick=()=>PV&&PV.cancel();
function openRules(){
  const R=S.rules; const ro=UI.mode==='present'?' disabled':'';
  const B=modal('חוקי הנדסה',`<p class="muted" style="margin-top:0">הבדיקות משתמשות בערכים האלה. הם מציגים אזהרות ותיקונים מוצעים ולעולם לא חוסמים שינוי. השינוי נשמר בקונפיגורציה הנוכחית.</p>
  <table><tr><th>חוק</th><th>ערך</th><th>הסבר</th><th>מקור</th></tr>${RULES.map(r=>`<tr><td>${r[1]}</td><td><input type="number" step="any" data-r="${r[0]}" value="${R[r[0]]}"${ro}> <span class="muted">${r[3]}</span></td><td>${r[4]}</td><td class="muted">${r[5]||'—'}</td></tr>`).join('')}</table>
  <div class="row edit" style="margin-top:10px;justify-content:flex-start"><button class="btn" id="rReset" style="flex:0">החזר לברירת מחדל</button></div>`,true);
  B.querySelectorAll('[data-r]').forEach(i=>i.onchange=()=>{const v=parseFloat(i.value); if(isFinite(v)) commit(s=>{s.rules[i.dataset.r]=v})});
  const rr=$('#rReset'); if(rr) rr.onclick=()=>{commit(s=>{s.rules=defaultRules()});openRules()};
}
function openCompare(){
  const ids=Object.keys(CFG.list).sort((a,b)=>CFG.list[a].order-CFG.list[b].order); if(CFG.draft||!ids.length) {}
  const cols=ids.map(id=>{let s;try{s=hydrate(JSON.parse(CFG.list[id].json))}catch(e){return null} if(id===CFG.active) s=S; s.rules=Object.assign(defaultRules(),s.rules||{}); const r=compute(s); return {n:CFG.list[id].name,s,r,act:id===CFG.active}}).filter(Boolean);
  if(CFG.draft) cols.unshift({n:'טיוטה',s:S,r:RES,act:true});
  const rows=[['סוג שלדה',x=>x.s.ch.type==='ladder'?'סולם':'פלטה'],['אורך שלדה',x=>fmt(x.s.ch.L)],['רוחב שלדה',x=>fmt(x.s.ch.FW)],['בין צירים',x=>fmt(x.s.ch.WB)],['בין גלגלים (מרכז)',x=>fmt(trackW(x.s))],
    ['מידות כוללות',x=>`${fmt(x.r.kpi.Lt,0)}×${fmt(x.r.kpi.W,0)}×${fmt(x.r.kpi.Ht,0)}`],['מרווח גחון',x=>fmt(x.r.kpi.belly)],['משקל כולל',x=>fmt(x.r.cg.m)+' ק״ג'],['משקל שלדה',x=>fmt(x.r.kpi.chM,2)+' ק״ג'],
    ['גובה מרכז כובד',x=>fmt(x.r.cg.z)],['התהפכות צידית (גרוע)',x=>fmt(x.r.stab.minLat)+'°'],['התהפכות אורכית (גרוע)',x=>fmt(x.r.stab.minLon)+'°'],['צריכה',x=>fmt(x.r.kpi.P,0)+' W'],['זמן עבודה',x=>fmt(x.r.kpi.run)+' ש׳'],
    ['LiDAR מוסתר',x=>fmt(x.r.lidar?.pct,1)+'%'],['ניצולת שטח',x=>fmt(x.r.kpi.fill,0)+'%'],['אזהרות',x=>x.r.kpi.warn]];
  modal('השוואת קונפיגורציות',`<div style="overflow:auto"><table><tr><th></th>${cols.map(c=>`<th style="color:${c.act?'var(--amber)':''}">${esc(c.n)}</th>`).join('')}</tr>
   ${rows.map(([l,f])=>`<tr><th>${l}</th>${cols.map(c=>`<td class="num">${f(c)}</td>`).join('')}</tr>`).join('')}
   <tr><th>בדיקות</th>${cols.map(c=>`<td>${c.r.checks.map(k=>`<span title="${k.n}" style="display:inline-block;width:9px;height:9px;border-radius:50%;margin:1px;background:${k.status==='ok'?'var(--ok)':k.status==='acc'?'var(--amber)':'var(--bad)'}"></span>`).join('')}</td>`).join('')}</tr></table></div>`,true);
}

/* ================== top bar ================== */
$('#views').querySelectorAll('button').forEach(b=>b.onclick=()=>{ UI.view=b.dataset.v; $('#views').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); fitView(); });
$('#modes').querySelectorAll('button').forEach(b=>b.onclick=()=>{ UI.mode=b.dataset.m; document.body.classList.toggle('present',UI.mode==='present'); $('#modes').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); $('#hint').style.display=UI.mode==='present'?'none':''; renderAll(); });
$('#bUndo').onclick=undo; $('#bRedo').onclick=redo; $('#bRules').onclick=openRules; $('#bCompare').onclick=openCompare;
$('#zIn').onclick=()=>zoom(1/1.2); $('#zOut').onclick=()=>zoom(1.2); $('#zFit').onclick=fitView;
$('#bSave').onclick=async()=>{ const name=(CFG.list[CFG.active]?.name||'kli-config').replace(/[^\w֐-׿ -]+/g,'_'); const data=JSON.stringify({app:'kli-chassis',name:CFG.list[CFG.active]?.name||'טיוטה',config:S},null,1);
  let dl=null; try{ if(window.claude&&window.claude.use) dl=await Promise.race([window.claude.use('downloads'),new Promise(r=>setTimeout(()=>r(null),3000))]) }catch(e){}
  if(dl){ try{ await dl.save({filename:name+'.json',data}); toast('הקובץ נשמר'); return; }catch(e){ if(e&&/declin|cancel|reject/i.test(e.code||e.message||'')){toast('השמירה בוטלה');return} } }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/json'})); a.download=name+'.json'; a.click(); }catch(e){}
  const B=modal('שמירה לקובץ',`<p class="muted" style="margin-top:0">אם ההורדה לא התחילה, העתיקי את הטקסט לקובץ ‎.json‎:</p><textarea id="jsonOut" style="min-height:220px;direction:ltr;font-family:JetBrains Mono,monospace;font-size:11px">${esc(data)}</textarea><div class="row" style="margin-top:8px;justify-content:flex-start"><button class="btn pri" id="cpy" style="flex:0">העתק</button></div>`);
  $('#cpy').onclick=async()=>{ try{ await navigator.clipboard.writeText(data); toast('הועתק') }catch(e){ $('#jsonOut').select(); toast('סמני והעתיקי ידנית') } };
};
$('#bLoad').onclick=()=>$('#fileIn').click();
$('#fileIn').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ const j=JSON.parse(rd.result); const cfg=j.config||j; if(!cfg.ch||!cfg.comps) throw 0;
  hydrate(cfg); const n={id:uid(),name:(j.name||f.name.replace(/\.json$/,''))+' (נטען)',order:Date.now(),json:JSON.stringify(cfg),updatedAt:Date.now()}; Store.put(n); loadCfg(n.id); toast('נטען כקונפיגורציה חדשה'); }
  catch(err){ toast('הקובץ לא נראה כמו קונפיגורציה של הלוח הזה') } }; rd.readAsText(f); e.target.value=''; };
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea,select')) return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault(); e.shiftKey?redo():undo()}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}
  else if(e.key==='Escape'){ if($('#modal').classList.contains('on')) closeModal(); else {UI.sel=null;renderSide();rerender()} }
  else if(UI.sel&&UI.mode==='design'&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','PageUp','PageDown'].includes(e.key)){ e.preventDefault(); const st=e.shiftKey?5:0.5;
    commit(s=>{const c=s.comps.find(k=>k.id===UI.sel); if(!c||c.locked||['wheels','armtip','arm','binact','bin'].includes(c.mount)&&c.key!=='bin') return;
      if(e.key==='ArrowRight')c.x+=st; if(e.key==='ArrowLeft')c.x-=st; if(e.key==='ArrowUp')c.y+=st; if(e.key==='ArrowDown')c.y-=st; if(e.key==='PageUp'){c.z+=st;if(c.mount==='top')c.mount='free'} if(e.key==='PageDown'){c.z=Math.max(0,c.z-st)} }); }
});

/* ================== boot ================== */
resize(); fitView(); renderAll();
$('#bGh').onclick=openGhConnect;
Store.init();
window.__kli={hydrate,get S(){return S},get RES(){return RES},compute,makeDefault,resolve,UI,CFG,commit,ORB,fitView};
</script>
